# ProjectWatch Rwanda — local infrastructure (M2 / 16 GB Docker profile)
#
# Single-node Compose: PostGIS (vectors), MinIO (raster object storage),
# GeoServer (OGC services). Resource limits keep the stack within ~12 GB
# RAM budget per AGENTS.md §4 constraints.

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: pw-postgis
    environment:
      POSTGRES_USER: projectwatch
      POSTGRES_PASSWORD: projectwatch
      POSTGRES_DB: projectwatch
    ports:
      - "5433:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectwatch -d projectwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    networks:
      - pw-net

  minio:
    image: minio/minio:latest
    container_name: pw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - pw-net

  geoserver:
    image: kartoza/geoserver:2.25.2
    container_name: pw-geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    ports:
      - "8080:8080"
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - geoserver-data:/opt/geoserver_data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks:
      - pw-net

  geoserver-setup:
    image: python:3.12-slim
    container_name: pw-geoserver-setup
    depends_on:
      geoserver:
        condition: service_started
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USER: admin
      GEOSERVER_PASSWORD: geoserver
      PG_HOST: postgis
      PG_DB: projectwatch
      PG_USER: projectwatch
      PG_PASS: projectwatch
    volumes:
      - ./geoserver/provision.py:/provision.py
    command: sh -c "pip install --quiet requests && python3 /provision.py"
    networks:
      - pw-net
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: pw-api
    environment:
      DATABASE_URL: postgres://projectwatch:projectwatch@postgis:5432/projectwatch
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - pw-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

  ingestion:
    build:
      context: ../services/ingestion
      dockerfile: Dockerfile
    container_name: pw-ingestion
    environment:
      API_URL: http://api:4000
      PROVIDER: mock
      INGESTION_SOURCE: sentinel-2
      SCENE_COUNT: "2"
      POLL_INTERVAL: "10"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: satellite-processed
    depends_on:
      - api
      - minio
    networks:
      - pw-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

networks:
  pw-net:
    driver: bridge

volumes:
  postgis-data:
  minio-data:
  geoserver-data:
